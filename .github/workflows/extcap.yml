name: Extcap

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.repository == 'openthread/ot-br-posix' && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:

  extcap:
    name: extcap
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: audit

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: recursive
        persist-credentials: false

    - name: Bootstrap OTBR Dependencies
      run: tests/scripts/bootstrap.sh

    - name: Install Dependencies
      run: |
        echo "wireshark-common wireshark-common/install-setuid boolean true" | sudo debconf-set-selections
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          socat \
          tshark
        sudo setcap -r /usr/bin/dumpcap 2>/dev/null || true
        sudo chmod 755 /usr/bin/dumpcap

    - name: Run Extcap Functional Tests
      run: |
        tests/scripts/check-extcap
